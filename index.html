<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>廁紙監控</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      text-align: center;
      width: 100%;
      max-width: 340px;
    }
    h1 { font-size: 20px; margin: 0 0 8px 0; color: #333; }
    .datetime { font-size: 14px; color: #888; margin-bottom: 25px; }
    .circle-container {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto 18px;
    }
    .circle-bg { fill: none; stroke: #eeeeee; stroke-width: 12; }
    .circle-progress {
      fill: none;
      stroke-width: 12;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
      transition: stroke-dashoffset 0.6s ease, stroke 0.3s;
    }
    .normal { stroke: #2e7d32; }
    .warning { stroke: #d32f2f; }
    .percent-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      font-weight: bold;
      color: #333;
    }
    .status { font-size: 15px; margin-top: 6px; }
    .status.ok { color: #2e7d32; }
    .status.low { color: #d32f2f; font-weight: bold; }
    .update-time { margin-top: 16px; font-size: 12px; color: #aaa; }
    .debug { margin-top: 10px; font-size: 11px; color: #999; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h1>廁紙剩餘量</h1>
    <div id="datetime" class="datetime">--</div>

    <div class="circle-container">
      <svg width="180" height="180" viewBox="0 0 180 180">
        <circle class="circle-bg" cx="90" cy="90" r="80"></circle>
        <circle id="progressCircle" class="circle-progress normal" 
                cx="90" cy="90" r="80"
                stroke-dasharray="502.4" 
                stroke-dashoffset="502.4"></circle>
      </svg>
      <div id="percentText" class="percent-text">--%</div>
    </div>

    <div id="statusText" class="status">正在載入...</div>
    <div id="updateTime" class="update-time"></div>
    <div id="debug" class="debug"></div>
  </div>

  <!-- 使用 compat 版本，對 iPhone 較穩定 -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      databaseURL: "https://toiletpapermonitor-1e20f-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const paperRef = database.ref('device/paper_level');

    const circumference = 502.4;

    function updateDateTime() {
      const now = new Date();
      document.getElementById('datetime').textContent = now.toLocaleString('zh-HK', { hour12: false });
    }
    updateDateTime();
    setInterval(updateDateTime, 1000);

    paperRef.on('value', (snapshot) => {
      const level = snapshot.val();
      const progressCircle = document.getElementById('progressCircle');
      const percentText = document.getElementById('percentText');
      const statusText = document.getElementById('statusText');
      const updateTime = document.getElementById('updateTime');
      const debug = document.getElementById('debug');

      debug.textContent = "讀取到: " + level;

      if (level === null || level === undefined) {
        percentText.textContent = "--%";
        statusText.textContent = "尚未有數據";
        return;
      }

      const offset = circumference - (level / 100) * circumference;
      progressCircle.style.strokeDashoffset = offset;
      percentText.textContent = level + "%";

      if (level < 20) {
        progressCircle.classList.remove('normal');
        progressCircle.classList.add('warning');
        statusText.className = "status low";
        statusText.textContent = "⚠ 紙量不足，請盡快更換";
      } else {
        progressCircle.classList.remove('warning');
        progressCircle.classList.add('normal');
        statusText.className = "status ok";
        statusText.textContent = "紙量正常";
      }

      updateTime.textContent = "最後更新：" + new Date().toLocaleTimeString('zh-HK');
    }, (error) => {
      document.getElementById('debug').textContent = "錯誤: " + error.message;
    });
  </script>
</body>
</html>
